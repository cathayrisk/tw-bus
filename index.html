<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="公車">
<title>下一班公車</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#E7EBEA; --surface:#FFFFFF; --surface-2:#F3F6F5; --line:#C9D3D1; --line-soft:#DFE6E4;
    --ink:#15211F; --ink-2:#4A5A57; --ink-3:#758582;
    --map-ground:#DCE4E2;
    --r307:#C43C33; --r307b:#DD8578; --r265a:#0B6473; --r265b:#2A8D95; --r265c:#55A8A9; --r265d:#86C2BE;
    --rx:#6B5B95;
    --stale:#8E9B98; --signal:#B4601C; --ok:#2E7D5B; --bad:#B3342B;
    --shadow:0 1px 2px rgba(20,35,33,.08), 0 8px 24px rgba(20,35,33,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0C1513; --surface:#131F1D; --surface-2:#182624; --line:#2A3A37; --line-soft:#213130;
      --ink:#E2EAE7; --ink-2:#9DADAA; --ink-3:#6F807D;
      --map-ground:#0F1A18;
      --r307:#F0665A; --r307b:#B4685F; --r265a:#3FC6D6; --r265b:#3AA5AE; --r265c:#5E8E90; --r265d:#79A9A5;
      --rx:#A192C9;
      --stale:#5C6C69; --signal:#E09A4E; --ok:#5CBF92; --bad:#F0766B;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Barlow","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .app{height:100%; display:grid; grid-template-rows:auto 1fr auto; min-height:0}

  /* ── header ─────────────────────────────────────────── */
  .bar{padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--surface); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .bar h1{margin:0; font-family:"Barlow Condensed","Noto Sans TC",sans-serif;
    font-size:25px; font-weight:700; line-height:1.1; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; min-width:0}
  #places{margin-bottom:6px}
  #places button{font-weight:600}
  .bar .spacer{flex:1 1 auto}
  .stamp{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px;
    font-variant-numeric:tabular-nums; color:var(--ink-2); display:flex; align-items:center; gap:7px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .live .pulse{animation:blip 2s ease-in-out infinite}
  .down .pulse{background:var(--bad); animation:none}
  @keyframes blip{0%,100%{opacity:1}45%{opacity:.2}}
  @media (prefers-reduced-motion:reduce){.live .pulse{animation:none}}

  .dirs{display:flex; width:100%; border:1px solid var(--line); border-radius:4px; overflow:hidden}
  .dirs button{flex:1 1 0; border:0; border-right:1px solid var(--line); background:var(--surface);
    color:var(--ink-2); padding:7px 8px; cursor:pointer; font:inherit; font-size:13.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dirs button:last-child{border-right:0}
  .dirs button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}

  /* ── main ───────────────────────────────────────────── */
  .shell{display:grid; grid-template-rows:auto auto 1fr; min-height:0; overflow:hidden}
  .shell.global{grid-template-rows:0 0 1fr}
  /* 收起地圖時看板吃滿整個畫面 */
  .shell.nomap{grid-template-rows:auto 1fr 0}
  .roadbar{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline;
    padding:7px 16px; background:var(--surface-2); border-bottom:1px solid var(--line);
    font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .roadbar .rt{font-family:"Barlow Condensed",sans-serif; font-weight:600;
    font-size:13.5px; color:var(--ink)}
  .roadbar b{font-weight:600}
  .roadbar b.j{color:var(--bad)}
  .roadbar b.s{color:var(--signal)}
  .roadbar .rm{margin-left:auto; color:var(--ink-3); font-size:11px}
  .shell.nomap .mapwrap{display:none}

  .board{overflow-y:auto; background:var(--surface); border-bottom:1px solid var(--line)}
  .row{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
    padding:11px 16px; border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:0}
  .row .badge{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:16px;
    padding:2px 9px; border-radius:3px; color:#fff; background:var(--c); white-space:nowrap; flex:none}
  .row .mid{min-width:0}
  .row .veh{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2);
    font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .sub{font-size:11.5px; color:var(--ink-3); margin-top:1px}
  .row .big{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:20px;
    font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; line-height:1.15}
  .row .big small{display:block; font-size:11px; font-weight:400; color:var(--ink-3);
    font-family:"Barlow","Noto Sans TC",sans-serif}
  .big.now{color:var(--signal)}
  .big.soon{color:var(--ok)}
  .big.dead{color:var(--ink-3); font-size:15px; font-weight:500}
  .row.picked{background:var(--surface-2)}
  .flag{display:inline-block; font-size:10.5px; padding:0 5px; border-radius:2px;
    border:1px solid currentColor; vertical-align:1px}
  .flags{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px}
  .row .veh .flag{margin-left:5px}
  .flag.warn{color:var(--signal)}
  .row .flag.warn{color:var(--signal)}
  .flag.stall{color:var(--bad)}
  .empty{padding:22px 16px; color:var(--ink-3); font-size:13px}
  .row.missing{opacity:.55}
  .row.missing .badge{background:var(--ink-3)}

  .mapwrap{position:relative; min-height:0; background:var(--map-ground); overflow:hidden}
  #map{width:100%; height:100%; display:block; touch-action:none; cursor:grab}
  #map.drag{cursor:grabbing}
  .hud{position:absolute; left:10px; top:10px; display:flex; gap:6px; flex-wrap:wrap;
    pointer-events:none; max-width:calc(100% - 20px)}
  .chip{background:var(--surface); border:1px solid var(--line); border-radius:3px;
    padding:3px 7px; font-family:"IBM Plex Mono",monospace; font-size:11px;
    color:var(--ink-2); font-variant-numeric:tabular-nums; box-shadow:var(--shadow)}
  .zoombox{position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:4px}
  .zoombox button{min-width:30px; height:30px; padding:0 6px; white-space:nowrap;
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    border-radius:3px; font-size:15px; line-height:1; cursor:pointer; box-shadow:var(--shadow)}

  /* ── footer ─────────────────────────────────────────── */
  .foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 16px; padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
    background:var(--surface); border-top:1px solid var(--line)}
  .btn{border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:3px; padding:6px 11px; cursor:pointer; font:inherit; font-size:13px}
  .btn[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
  .err{color:var(--bad); font-size:12px; font-family:"IBM Plex Mono",monospace; flex:1 1 100%}
  .win{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; flex:none}
  .win button{border:0; border-right:1px solid var(--line); background:var(--surface);
    color:var(--ink-2); padding:6px 10px; cursor:pointer; font:inherit; font-size:12.5px; white-space:nowrap}
  .win button:last-child{border-right:0}
  .win button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}

  /* ── stop picker ────────────────────────────────────── */
  dialog{border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink);
    padding:0; width:min(440px, 92vw); max-height:78vh; box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(10,20,18,.42)}
  .dlg-head{padding:14px 16px 10px; border-bottom:1px solid var(--line-soft)}
  .dlg-head h2{margin:0 0 9px; font-family:"Barlow Condensed",sans-serif; font-size:17px; font-weight:600}
  #q{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px;
    background:var(--bg); color:var(--ink); font:inherit; font-size:15px}
  .dlg-list{overflow-y:auto; max-height:52vh}
  .opt{display:flex; justify-content:space-between; gap:10px; align-items:baseline;
    padding:9px 16px; border-bottom:1px solid var(--line-soft); cursor:pointer;
    background:none; border-left:0; border-right:0; border-top:0; width:100%;
    text-align:left; color:inherit; font:inherit}
  .opt:hover{background:var(--surface-2)}
  .opt .rs{font-size:11.5px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace;
    white-space:nowrap}
  .dlg-foot{padding:10px 16px; border-top:1px solid var(--line-soft); display:flex; justify-content:flex-end}

  :focus-visible{outline:2px solid var(--signal); outline-offset:2px}

  .c-16111{--c:var(--r307)}  .c-19108{--c:var(--r307b)}
  .c-10482{--c:var(--r265a)} .c-10481{--c:var(--r265b)}
  .c-11171{--c:var(--r265c)} .c-16131{--c:var(--r265d)}
  .c-other{--c:var(--rx)}

  .route{fill:none; stroke:var(--c); stroke-linecap:round; stroke-linejoin:round}
  .heat{fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:.45}
  .heat.jam{stroke:var(--bad)}
  .heat.slow{stroke:var(--signal)}
  .route.ghost{stroke:var(--ink-3); stroke-opacity:.2}
  .stopdot{fill:var(--surface); stroke:var(--ink-3)}
  .mystop{fill:var(--signal); stroke:var(--surface)}
  .bus path{fill:var(--c); stroke:var(--c); stroke-linejoin:round}
  .bus.stale path{fill:none; stroke:var(--stale); stroke-dasharray:2 1.6}
  .bus.pick .halo{fill:none; stroke:var(--c); stroke-opacity:.55}
  .bus .idle{fill:var(--surface); stroke:none}
  .lbl{font-family:"Barlow Condensed","Noto Sans TC",sans-serif; font-size:11px; font-weight:600;
    fill:var(--ink-2); paint-order:stroke; stroke:var(--map-ground); stroke-width:3px; pointer-events:none}

  @media (max-width:620px){
    .bar h1{font-size:21px}
    .row{padding:10px 14px; gap:9px}
    .row .big{font-size:19px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <h1 id="stopname">—</h1>
    <span class="spacer"></span>
    <span class="stamp"><span class="pulse"></span><span id="stamp">連線中…</span></span>
    <div class="dirs" id="places"></div>
    <div class="dirs" id="dirs"></div>
  </header>

  <main class="shell" id="shell">
    <div class="roadbar" id="roadbar" hidden></div>
    <section class="board" id="board"></section>
    <section class="mapwrap">
      <svg id="map" role="img" aria-label="站牌與來車位置圖"></svg>
      <div class="hud"><span class="chip" id="chip">—</span></div>
      <div class="zoombox">
        <button type="button" id="zin" aria-label="放大">+</button>
        <button type="button" id="zout" aria-label="縮小">−</button>
        <button type="button" id="zfit" aria-label="重設範圍" style="font-size:11px">重設</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="win" role="group" aria-label="顯示多久之內會到的車">
      <button type="button" data-w="300" aria-pressed="true">5 分內</button>
      <button type="button" data-w="600" aria-pressed="false">10 分</button>
      <button type="button" data-w="0" aria-pressed="false">全部</button>
    </div>
    <button type="button" class="btn" id="showroad" aria-pressed="true">路況</button>
    <button type="button" class="btn" id="showmap" aria-pressed="false">顯示地圖</button>
    <button type="button" class="btn" id="mode" aria-pressed="false">看整條路線</button>
    <button type="button" class="btn" id="toggle" aria-pressed="true">自動更新中</button>
    <button type="button" class="btn" id="once">立刻更新</button>
    <span class="err" id="err"></span>
  </footer>
</div>

<dialog id="picker">
  <div class="dlg-head">
    <h2>換一個站牌</h2>
    <input type="text" id="q" placeholder="輸入站名，例如 板橋、西門、龍山寺" autocomplete="off">
  </div>
  <div class="dlg-list" id="opts"></div>
  <div class="dlg-foot"><button type="button" class="btn" id="close">關閉</button></div>
</dialog>

  // 但紅燈與壅塞無法分離，所以一律稱「低速／停滯」，不稱「壅塞」。
  var JAM_KMH = 4, SLOW_KMH = 12;     // <4 判停滯、<12 判低速
  var PASS_MIN_S = 20;                // 待滿這麼久才改用通過速度，之前先用回報瞬時值

  var S = JSON.parse(document.getElementById('staticData').textContent);
  var KNOWN = ['16111','19108','10482','10481','11171','16131'];
  function cc(id){ return KNOWN.indexOf(String(id))>=0 ? 'c-'+id : 'c-other'; }

  // ── 幾何：把經緯度換成公尺平面，並算沿線里程 ───────────────────────────
  var MLAT = 110574, MLON = 111320*Math.cos(25.02*Math.PI/180);
  function mx(lon){ return lon*MLON; }
  function my(lat){ return lat*MLAT; }
  var LINE = {}, STOPD = {};

  function buildGeometry(){
    LINE = {}; STOPD = {};
    Object.keys(S.shapes).forEach(function(rid){
      Object.keys(S.shapes[rid]).forEach(function(g){
        var pts = S.shapes[rid][g], P=[], C=[0];
        for(var i=0;i<pts.length;i++) P.push([mx(pts[i][0]), my(pts[i][1])]);
        for(var j=1;j<P.length;j++) C.push(C[j-1] + Math.hypot(P[j][0]-P[j-1][0], P[j][1]-P[j-1][1]));
        LINE[rid+'/'+g] = {P:P, C:C};
      });
    });
    Object.keys(S.stops).forEach(function(rid){
      S.stops[rid].forEach(function(s){
        var pr = project(rid, s.g, s.x, s.y);
        if(pr) STOPD[rid+'/'+s.id] = pr.d;
      });
    });
  }

  // 把一個點投影到路線上，回傳沿線里程 d 與離線距離 off
  function project(rid, g, lon, lat){
    var L = LINE[rid+'/'+g]; if(!L) return null;
    var qx=mx(lon), qy=my(lat), P=L.P, C=L.C, bd=Infinity, bdist=0, bbrg=0;
    for(var i=1;i<P.length;i++){
      var ax=P[i-1][0], ay=P[i-1][1], vx=P[i][0]-ax, vy=P[i][1]-ay;
      var L2=vx*vx+vy*vy, t = L2 ? ((qx-ax)*vx+(qy-ay)*vy)/L2 : 0;
      t = t<0?0:(t>1?1:t);
      var px_=ax+t*vx, py_=ay+t*vy, d=Math.hypot(qx-px_, qy-py_);
      if(d<bd){
        bd=d; bdist = C[i-1] + Math.hypot(px_-ax, py_-ay);
        bbrg = (Math.atan2(vx, vy)*180/Math.PI + 360) % 360;
      }
    }
    return {d:bdist, off:bd, brg:bbrg};
  }

  // ── 站牌索引（同名站牌可能分屬數個月台） ───────────────────────────────
  var stopIndex = {};   // 站名 -> [{rid, stop}]
  function buildIndex(){
    stopIndex = {};
    Object.keys(S.stops).forEach(function(rid){
      S.stops[rid].forEach(function(s){
        (stopIndex[s.n] || (stopIndex[s.n]=[])).push({rid:rid, s:s});
      });
    });
  }

  // ── 狀態 ──────────────────────────────────────────────────────────────
  var place = PLACES[0], plat = null;
  var cur = null, etaMap = {}, history = [], rows = [], picked = null;
  var busTimer=null, etaTimer=null, running=true, failures=0, globalMode=false;
  var showMap=false, showRoad=true;
  try{
    showMap  = localStorage.getItem('busShowMap')==='1';
    showRoad = localStorage.getItem('busShowRoad')!=='0';   // 預設開，可整組關掉做對照
  }catch(e){}

  try{
    var sv = localStorage.getItem('busPlace');
    if(sv){
      var f = PLACES.filter(function(x){ return x.name===sv; })[0];
      if(f) place = f;
      else place = {name:sv, match:[sv], routes:null, ntpc:[]};   // 從換站挑的臨時站牌
    }
  }catch(e){}

  // 這個站牌組底下、且在追蹤路線清單內的所有停靠
  function placeEntries(){
    var out=[];
    place.match.forEach(function(n){
      (stopIndex[n]||[]).forEach(function(e){
        if(place.routes && place.routes.indexOf(S.meta[e.rid].name)<0) return;
        out.push(e);
      });
    });
    return out;
  }
  // 月台＝實體站位。同一根站牌上的車都往同一個方向，所以用月台分頁比用去／返正確：
  // 同一個月台上，甲路線可能算去程、乙路線算返程，但人站的位置是同一個。
  function platforms(){
    var seen={}, out=[];
    placeEntries().forEach(function(e){
      var L=String(e.s.L);
      var o = seen[L] || (seen[L]={L:L, dest:{}, n:0}, out.push(seen[L]), seen[L]);
      var m=S.meta[e.rid];
      o.dest[String(e.s.g)==='0' ? m.to : m.from]=1; o.n++;
    });
    out.sort(function(a,b){ return b.n-a.n; });
    return out;
  }
  function platLabel(o){
    var d=Object.keys(o.dest);
    var tail = d.length<=2 ? d.join('／') : d.slice(0,2).join('／')+'…';
    return '往 '+tail;
  }
  function currentEntries(){
    return placeEntries().filter(function(e){ return String(e.s.L)===String(plat); });
  }

  // ── 取資料 ────────────────────────────────────────────────────────────
  function fetchBlob(name){
    return fetch(BASE+name+'.gz', {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error(name+' HTTP '+r.status);
      if(typeof DecompressionStream === 'undefined')
        throw new Error('瀏覽器不支援 DecompressionStream，請用新版 Chrome／Edge／Safari');
      return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).json();
    });
  }

  function pollBuses(){
    return fetchBlob('GetBusData').then(function(d){
      var pa = S.pa || {}, out=[];
      d.BusInfo.forEach(function(b){
        var rid = String(pa[b.RouteID] != null ? pa[b.RouteID] : b.RouteID);
        if(!S.meta[rid]) return;
        out.push({r:rid, b:b.BusID, x:+b.Longitude, y:+b.Latitude,
          s:parseInt(b.Speed||'0',10)||0, a:parseInt(b.Azimuth||'0',10)||0,
          g:String(b.GoBack), t:b.DataTime.slice(11),
          duty:b.DutyStatus, bs:b.BusStatus});
      });
      cur = {u:d.EssentialInfo.UpdateTime, bus:out};
      history.push({u:cur.u, bus:out}); if(history.length>HIST_N) history.shift();
      recordProbe();
      failures=0; setError(''); render();
    });
  }
  function pollEta(){
    return fetchBlob('GetEstimateTime').then(function(d){
      var m={};
      d.BusInfo.forEach(function(e){
        var rid=String(e.RouteID);
        if(S.meta[rid]) m[rid+'/'+e.StopID]=parseInt(e.EstimateTime,10);
      });
      etaMap=m; render();
    });
  }

  // ── 路況探針：累積每個 200m 區段的公車速度 ─────────────────────────────
  function cellKey(lon, lat, brg){
    var sect = ((Math.round(brg/(360/BRG_SECTORS)) % BRG_SECTORS) + BRG_SECTORS) % BRG_SECTORS;
    return Math.floor(lon/CELL_LON)+':'+Math.floor(lat/CELL_LAT)+':'+sect;
  }

  var probe = {};   // cellKey -> { 車號: {t0,d0,t,d,s} }，每台車一筆
  try{
    var raw = localStorage.getItem('busProbe4');
    if(raw){
      var o = JSON.parse(raw), cut = Date.now()/1000 - JAM_WIN_MIN*60;
      Object.keys(o).forEach(function(k){
        var bin={}, any=false;
        Object.keys(o[k]).forEach(function(id){
          if(o[k][id].t > cut){ bin[id]=o[k][id]; any=true; }
        });
        if(any) probe[k]=bin;
      });
    }
  }catch(e){}

  var probeSaveAt = 0;
  function recordProbe(){
    if(!cur) return;
    var now = Date.now()/1000, cut = now - JAM_WIN_MIN*60;
    cur.bus.forEach(function(b){
      if(b.duty!=='1') return;
      var pr = project(b.r, b.g, b.x, b.y);
      if(!pr || pr.off > OFFLINE_M) return;
      var k = cellKey(b.x, b.y, pr.brg);
      var bin = probe[k] || (probe[k]={});
      var e = bin[b.b];
      // 同一台車在同一格只有一筆：第一次進來建立，之後就地更新，
      // 所以卡住越久這一筆的通過速度越低，但票數永遠是 1。
      if(!e) bin[b.b] = {t0:now, d0:pr.d, t:now, d:pr.d, s:b.s};
      else { e.t=now; e.d=pr.d; e.s=b.s; }
    });
    Object.keys(probe).forEach(function(k){
      var bin=probe[k], any=false;
      Object.keys(bin).forEach(function(id){
        if(bin[id].t <= cut) delete bin[id]; else any=true;
      });
      if(!any) delete probe[k];
    });
    if(now - probeSaveAt > 60){
      probeSaveAt = now;
      try{ localStorage.setItem('busProbe4', JSON.stringify(probe)); }catch(e){}
    }
  }
  // 一台車通過這一格的速度：里程差÷時間差。待得不夠久就先用它回報的瞬時值。
  function passSpeed(e){
    var dt = e.t - e.t0;
    if(dt >= PASS_MIN_S) return Math.max(0, (e.d - e.d0)/dt*3.6);
    return e.s;
  }
  function cellInfo(lon, lat, brg){
    var b = probe[cellKey(lon, lat, brg)];
    if(!b) return null;
    var ids = Object.keys(b);
    if(ids.length < JAM_MIN_N) return null;
    var v = ids.map(function(id){ return passSpeed(b[id]); }).sort(function(x,y){ return x-y; });
    var oldest = Math.min.apply(null, ids.map(function(id){ return b[id].t; }));
    return {kmh: v[Math.floor(v.length/2)], n: ids.length,
            age: Date.now()/1000 - oldest};
  }
  function cellSpeed(lon, lat, brg){
    var o = cellInfo(lon, lat, brg);
    return o ? o.kmh : null;
  }

  // ── 核心：這一站下一班是誰、在哪 ──────────────────────────────────────
  function ageOf(b){
    if(!cur) return 0;
    var a = hms(cur.u.slice(11)) - hms(b.t);
    if(a < -60) a += 86400;
    return a<0?0:a;
  }
  function hms(s){ var p=s.split(':'); return (+p[0])*3600+(+p[1])*60+(+p[2]); }

  // 這台車連續幾次輪詢速度為 0
  function stalledFor(busId){
    var n=0;
    for(var i=history.length-1;i>=0;i--){
      var f=history[i], hit=null;
      for(var j=0;j<f.bus.length;j++) if(f.bus[j].b===busId){ hit=f.bus[j]; break; }
      if(hit && hit.s===0) n++; else break;
    }
    return n;
  }

  function computeRows(){
    rows = [];
    if(!cur) return;

    currentEntries().forEach(function(e){
      var rid=e.rid, s=e.s, g=String(s.g), key=rid+'/'+s.id;
      var official = (key in etaMap) ? etaMap[key] : null;
      var officialOK = official!=null && official>=0;
      var dstop = STOPD[key];
      if(dstop==null) return;

      // 這條路線上游、同向、行駛中的車，全部撈出來由近到遠排
      var ups=[];
      cur.bus.forEach(function(b){
        if(b.r!==rid || b.g!==g || b.duty!=='1') return;
        var pr = project(rid, g, b.x, b.y);
        if(!pr || pr.off > OFFLINE_M || pr.d >= dstop) return;
        ups.push({bus:b, d:pr.d, gap:dstop-pr.d, brg:pr.brg});
      });
      ups.sort(function(a,b){ return a.gap-b.gap; });

      // 用第一台的距離÷官方ETA 反推的速度，只拿來檢查「這台車配得上這個時間嗎」，
      // 不拿來推估後面幾台 —— 實測那樣做比固定速度更差。
      var implied=null, calibrated=false;
      if(ups.length && officialOK && official>30){
        implied = ups[0].gap/official*3.6;
        if(implied>=SPD_LO && implied<=SPD_HI) calibrated=true;
      }

      if(!ups.length){
        rows.push({rid:rid, stop:s, g:g, bus:null, eta:official, src:'official',
                   order:0, upstream:0, calibrated:false});
        return;
      }

      // 官方數字對不上最近那台車時，不把它掛到那台車身上，但車照列
      // —— 推估用固定速度算，本來就不依賴這個校準。
      var nearArrival = officialOK && official<60 && ups[0].gap<500;
      var canPin = officialOK && (calibrated || nearArrival);
      if(officialOK && !canPin){
        rows.push({rid:rid, stop:s, g:g, bus:null, eta:official, src:'official',
                   order:0, upstream:ups.length, calibrated:false, unmatched:true});
      }

      ups.forEach(function(u,i){
        var t, src;
        if(i===0 && canPin){ t=official; src='official'; }
        else { t=u.gap/(EST_KMH/3.6) + EST_BASE_S; src='est'; }
        var nleft=0;
        S.stops[rid].forEach(function(x){
          if(String(x.g)!==g || x.q>=s.q) return;
          var dx=STOPD[rid+'/'+x.id];
          if(dx!=null && dx>u.d) nleft++;
        });
        rows.push({rid:rid, stop:s, g:g, bus:u.bus, busId:u.bus.b, gap:u.gap, bd:u.d, dstop:dstop,
                   eta:t, src:src, nleft:nleft, order:i, upstream:ups.length,
                   calibrated:calibrated, stall:stalledFor(u.bus.b),
                   cellKmh: cellSpeed(u.bus.x, u.bus.y, u.brg)});
      });
    });

    // 這個站牌組裡屬於新北市轄、目前資料源沒有的路線，明確列出來而不是靜靜消失
    (place.ntpc||[]).forEach(function(n){
      rows.push({rid:null, name:n, stop:null, g:null, bus:null, eta:null,
                 src:'none', order:0, upstream:0, missing:true});
    });
    rows.sort(function(a,b){
      if(a.missing!==b.missing) return a.missing?1:-1;
      var av=(a.eta==null||a.eta<0)?1e9:a.eta, bv=(b.eta==null||b.eta<0)?1e9:b.eta;
      return av-bv;
    });
    // 時間窗過濾：超過窗口的只留每條路線的第一台，免得「下一班」整個消失
    if(WINDOW_S > 0){
      rows = rows.filter(function(r){
        return r.order===0 || (r.eta!=null && r.eta>=0 && r.eta<=WINDOW_S);
      });
    }
  }

  // ── 畫面：看板 ────────────────────────────────────────────────────────
  var NEG = {'-1':'未發車','-2':'不停靠','-3':'末班已過','-4':'今日未營運'};
  var boardBox=document.getElementById('board');

  // 路況摘要：只針對「下一班」那台車的路廊算一次。
  // 不做跨路線合併——不同路線只共享部分路廊，之後會分岔，掛在月台層會誤導。
  var ROAD_BACK_M = 2000;   // 摘要固定看站牌前這段距離，與車目前在哪無關
  function roadSummary(){
    var r = rows.filter(function(x){ return x.bus; })[0];
    if(!r) return null;
    // 用固定回看距離，而不是「到最近那台車」——後者在車快到站時會縮成幾百公尺，
    // 摘要就變成一片無資料，講不出任何東西。
    var L = LINE[r.rid+'/'+r.g], shp = S.shapes[r.rid] && S.shapes[r.rid][r.g];
    if(!L || !shp) return null;
    var lo = Math.max(0, r.dstop - ROAD_BACK_M), pts=[];
    for(var k=0;k<shp.length;k++) if(L.C[k]>=lo && L.C[k]<=r.dstop) pts.push(shp[k]);
    pts.push([r.stop.x, r.stop.y]);
    if(pts.length < 2) return null;
    var t = {jam:0, slow:0, clear:0, nodata:0}, total=0, age=0;
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var dx=mx(b[0])-mx(a[0]), dy=my(b[1])-my(a[1]), len=Math.hypot(dx,dy);
      if(len<1) continue;
      var brg=(Math.atan2(dx,dy)*180/Math.PI+360)%360;
      var o=cellInfo((a[0]+b[0])/2, (a[1]+b[1])/2, brg);
      total+=len;
      if(!o){ t.nodata+=len; continue; }
      if(o.age>age) age=o.age;
      if(o.kmh<JAM_KMH) t.jam+=len; else if(o.kmh<SLOW_KMH) t.slow+=len; else t.clear+=len;
    }
    return {name:S.meta[r.rid].name, total:total, t:t, age:age,
            cover: total>0 ? 1-t.nodata/total : 0};
  }
  var roadBar=document.getElementById('roadbar');
  function drawRoad(){
    if(!showRoad || globalMode){ roadBar.hidden=true; return; }
    var q=roadSummary();
    if(!q || q.total<200){ roadBar.hidden=true; return; }
    roadBar.hidden=false;
    var km=function(m){ return m>=1000 ? (m/1000).toFixed(1)+' km' : Math.round(m)+' m'; };
    var bits=[];
    if(q.t.jam>0)  bits.push('<b class="j">停滯 '+km(q.t.jam)+'</b>');
    if(q.t.slow>0) bits.push('<b class="s">低速 '+km(q.t.slow)+'</b>');
    if(q.t.clear>0) bits.push('順暢 '+km(q.t.clear));
    if(q.t.nodata>0) bits.push('無資料 '+km(q.t.nodata));
    // 覆蓋率太低就別假裝知道路況
    if(q.cover < 0.4){
      roadBar.innerHTML = '<span class="rt">'+q.name+' 進站前 '+km(q.total)+'</span>'
        + '路況樣本不足（已量到 '+Math.round(q.cover*100)+'%）'
        + '<span class="rm">開著累積幾分鐘會補上</span>';
      return;
    }
    roadBar.innerHTML = '<span class="rt">'+q.name+' 進站前 '+km(q.total)+'</span>'
      + bits.join('・')
      + '<span class="rm">量測 ≤'+Math.max(1,Math.round(q.age/60))+' 分鐘前・推估</span>';
  }

  function drawBoard(){
    boardBox.textContent='';
    if(!rows.length){
      boardBox.innerHTML='<p class="empty">這個方向沒有追蹤中的路線停靠。'
        +'試試切換方向，或按左上角換一個站牌。</p>';
      return;
    }
    rows.forEach(function(r){
      var div=document.createElement('div');
      if(r.missing){
        div.className='row missing';
        div.innerHTML = '<span class="badge c-other">'+r.name+'</span>'
          + '<div class="mid"><div class="veh">新北市轄路線，這個資料源沒有</div>'
          + '<div class="sub">要接 TDX 才拿得到</div></div>'
          + '<div class="big dead">未接入</div>';
        boardBox.appendChild(div);
        return;
      }
      div.className='row '+cc(r.rid)+(picked===r.busId&&r.busId?' picked':'');

      var v=r.eta, cls='big', txt;
      if(v==null){ txt='無資料'; cls+=' dead'; }
      else if(v<0){ txt=NEG[String(v)]||'無資料'; cls+=' dead'; }
      else if(v<60){ txt='進站中'; cls+=' now'; }
      else if(v<=WINDOW_S||WINDOW_S===0){ txt=Math.round(v/60)+' 分'; cls+=' soon'; }
      else { txt=Math.round(v/60)+' 分'; }

      var tag = (r.bus && r.src==='est') ? '<small>推估</small>' : '<small>官方</small>';

      var mid;
      if(r.bus){
        // 只講這台車自己的狀態。路段狀況是「路」的屬性，統一在上方摘要講一次，
        // 不再逐列印累計長度——遠車路廊包含近車路廊，那個數字必然重複。
        var flags='';
        if(r.stall>=3) flags += '<span class="flag stall">停等 '+(r.stall*10)+' 秒</span>';
        if(showRoad && r.cellKmh!=null && r.cellKmh < SLOW_KMH){
          flags += '<span class="flag '+(r.cellKmh<JAM_KMH?'stall':'warn')+'">正在'
                 + (r.cellKmh<JAM_KMH?'停滯':'低速')+'路段 '+Math.round(r.cellKmh)+' km/h</span>';
        }
        mid = '<div class="veh">'+r.bus.b+'　'+r.bus.s+' km/h　'+Math.round(r.gap)+' m</div>'
            + '<div class="sub">還有 '+r.nleft+' 站　'
            + (r.order===0 ? '下一班' : '第 '+(r.order+1)+' 班')
            + '　月台 '+r.stop.L+'</div>'
            + (flags ? '<div class="flags">'+flags+'</div>' : '');
      } else if(r.unmatched){
        mid = '<div class="veh">官方預估，但對不上任何一台車'
            + '<span class="flag warn">未指認</span></div>'
            + '<div class="sub">下面 '+r.upstream+' 台為推估　月台 '+r.stop.L+'</div>';
      } else {
        mid = '<div class="veh">上游沒有行駛中的車</div>'
            + '<div class="sub">只顯示官方預估　月台 '+r.stop.L+'</div>';
      }

      div.innerHTML = '<span class="badge">'+S.meta[r.rid].name+'</span>'
        + '<div class="mid">'+mid+'</div>'
        + '<div class="'+cls+'">'+txt+tag+'</div>';
      if(r.busId) div.addEventListener('click', function(){
        picked = (picked===r.busId) ? null : r.busId; userMoved=false; render();
      });
      boardBox.appendChild(div);
    });
  }

  // ── 畫面：地圖 ────────────────────────────────────────────────────────
  var NS='http://www.w3.org/2000/svg', svg=document.getElementById('map');
  function el(t,a){ var e=document.createElementNS(NS,t); if(a) for(var k in a) e.setAttribute(k,a[k]); return e; }
  var gR=el('g'), gS=el('g'), gL=el('g'), gB=el('g');
  [gR,gS,gL,gB].forEach(function(g){ svg.appendChild(g); });
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');

  var PAD=26, VW=1000, bb=null, SC=1, VH=600, view={x:0,y:0,w:1000,h:600}, userMoved=false;

  function setFrame(pts){
    var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    pts.forEach(function(p){
      if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0];
      if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1];
    });
    if(x1-x0 < 0.004){ var cx=(x0+x1)/2; x0=cx-0.002; x1=cx+0.002; }
    if(y1-y0 < 0.003){ var cy=(y0+y1)/2; y0=cy-0.0015; y1=cy+0.0015; }
    var mx_=(x1-x0)*0.10, my_=(y1-y0)*0.12;
    x0-=mx_; x1+=mx_; y0-=my_; y1+=my_;
    bb={x0:x0,x1:x1,y0:y0,y1:y1};
    SC=(VW-PAD*2)/((x1-x0)*Math.cos(25.02*Math.PI/180));
    VH=(y1-y0)*SC+PAD*2;
    view={x:0,y:0,w:VW,h:VH};
    svg.setAttribute('viewBox','0 0 '+VW+' '+VH.toFixed(1));
  }
  function px(lon){ return PAD + (lon-bb.x0)*Math.cos(25.02*Math.PI/180)*SC; }
  function py(lat){ return PAD + (bb.y1-lat)*SC; }

  // 目前該顯示哪幾列（點選某條路線時只留那一條）
  function visibleRows(){
    return rows.filter(function(r){ return r.bus && (!picked || r.busId===picked); });
  }
  // 取出「來車位置 → 站牌」之間那一段線型（含兩端精確點）
  function corridor(r){
    var pts = S.shapes[r.rid] && S.shapes[r.rid][r.g];
    var L = LINE[r.rid+'/'+r.g];
    if(!pts || !L || r.bd==null) return [];
    var out = [[r.bus.x, r.bus.y]];
    for(var i=0;i<pts.length;i++){
      if(L.C[i] > r.bd && L.C[i] < r.dstop) out.push(pts[i]);
    }
    out.push([r.stop.x, r.stop.y]);
    return out;
  }

  // 沿著路廊逐段查地理格，把連續同狀態的段落合併成一條線
  function heat(r){
    var pts = corridor(r);
    if(pts.length < 2) return [];
    var out = [], run = null;
    for(var i=1;i<pts.length;i++){
      var a=pts[i-1], b=pts[i];
      var dx=mx(b[0])-mx(a[0]), dy=my(b[1])-my(a[1]), len=Math.hypot(dx,dy);
      if(len < 1) continue;
      var brg = (Math.atan2(dx, dy)*180/Math.PI + 360) % 360;
      var v = cellSpeed((a[0]+b[0])/2, (a[1]+b[1])/2, brg);
      var cls = (v==null || v>=SLOW_KMH) ? null : (v<JAM_KMH ? 'jam' : 'slow');
      if(run && run.cls===cls){ run.pts.push(b); run.len += len; }
      else {
        if(run && run.cls) out.push(run);
        run = {cls:cls, pts:[a,b], len:len};
      }
    }
    if(run && run.cls) out.push(run);
    return out;
  }

  function drawMap(){
    if(!bb) return;
    var k=view.w/VW;
    gR.textContent=''; gS.textContent=''; gL.textContent=''; gB.textContent='';

    if(globalMode){
      Object.keys(S.meta).forEach(function(rid){
        ['0','1'].forEach(function(g){
          var pts=S.shapes[rid] && S.shapes[rid][g]; if(!pts) return;
          var d=pts.map(function(p,i){ return (i?'L':'M')+px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1); }).join('');
          gR.appendChild(el('path',{d:d, class:'route '+cc(rid),
            'stroke-width':(3*k).toFixed(2), 'stroke-opacity': g==='0'?.85:.4,
            'stroke-dasharray': g==='1'?'7 5':'none'}));
        });
      });
    } else {
      // 站牌模式只畫「來車 → 你」這一段路廊，其餘路線不畫，避免整張圖都是線
      visibleRows().forEach(function(r){
        var seg = corridor(r); if(seg.length<2) return;
        (showRoad ? heat(r) : []).forEach(function(h){
          var hd = h.pts.map(function(p,i){ return (i?'L':'M')+px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1); }).join('');
          gR.appendChild(el('path',{d:hd, class:'heat '+h.cls, 'stroke-width':(9*k).toFixed(2)}));
        });
        var d = seg.map(function(p,i){ return (i?'L':'M')+px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1); }).join('');
        gR.appendChild(el('path',{d:d, class:'route '+cc(r.rid), 'stroke-width':(3.6*k).toFixed(2)}));
        // 沿途還沒到的站，畫成小點，跟「還有 N 站」對得起來
        S.stops[r.rid].forEach(function(x){
          if(String(x.g)!==r.g || x.q>=r.stop.q) return;
          var dx = STOPD[r.rid+'/'+x.id];
          if(dx==null || dx<=r.bd || dx>=r.dstop) return;
          gS.appendChild(el('circle',{cx:px(x.x).toFixed(1), cy:py(x.y).toFixed(1),
            r:(2.6*k).toFixed(2), class:'stopdot', 'stroke-width':(1.1*k).toFixed(2)}));
        });
      });
    }

    // 我站的這一根（或這幾根）站牌
    currentEntries().forEach(function(e){
      gS.appendChild(el('circle',{cx:px(e.s.x).toFixed(1), cy:py(e.s.y).toFixed(1),
        r:(6*k).toFixed(2), class:'mystop', 'stroke-width':(2*k).toFixed(2)}));
    });
    var first=currentEntries()[0];
    if(first){
      var t=el('text',{x:(px(first.s.x)+9*k).toFixed(1),
                       y:(py(first.s.y)-8*k).toFixed(1), class:'lbl'});
      t.textContent=place.name; t.style.fontSize=(12*k).toFixed(1)+'px';
      t.style.strokeWidth=(3*k).toFixed(1)+'px'; gL.appendChild(t);
    }

    var list = globalMode ? (cur?cur.bus:[]) : visibleRows().map(function(r){ return r.bus; });

    list.forEach(function(b){
      var stale=ageOf(b)>STALE_S;
      var g=el('g',{class:'bus '+cc(b.r)+(stale?' stale':'')+(!globalMode?' pick':''),
        transform:'translate('+px(b.x).toFixed(1)+','+py(b.y).toFixed(1)+') rotate('+b.a+') scale('+k.toFixed(3)+')'});
      if(!globalMode) g.appendChild(el('circle',{class:'halo', r:13, 'stroke-width':1.4}));
      g.appendChild(el('path',{d:'M0 -6.6 L4.6 5 L0 2.4 L-4.6 5 Z', 'stroke-width': stale?1.4:0.9}));
      if(b.s===0 && !stale) g.appendChild(el('circle',{class:'idle', cy:0, r:1.5}));
      gB.appendChild(g);
    });
  }

  function reframe(){
    var pts=[];
    if(globalMode){
      Object.keys(S.shapes).forEach(function(rid){
        Object.keys(S.shapes[rid]).forEach(function(g){
          S.shapes[rid][g].forEach(function(p){ pts.push(p); });
        });
      });
    } else {
      currentEntries().forEach(function(e){ pts.push([e.s.x, e.s.y]); });
      visibleRows().forEach(function(r){
        corridor(r).forEach(function(p){ pts.push(p); });
      });
    }
    if(!pts.length) pts=[[121.46,25.01],[121.47,25.02]];
    setFrame(pts);
  }

  // 平移縮放
  var drag=null;
  svg.addEventListener('pointerdown', function(e){
    drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; userMoved=true;
    svg.setPointerCapture(e.pointerId); svg.classList.add('drag');
  });
  svg.addEventListener('pointermove', function(e){
    if(!drag) return;
    var r=svg.getBoundingClientRect(), s=Math.max(view.w/r.width, view.h/r.height);
    view.x=drag.vx-(e.clientX-drag.x)*s; view.y=drag.vy-(e.clientY-drag.y)*s;
    svg.setAttribute('viewBox', view.x+' '+view.y+' '+view.w+' '+view.h);
  });
  function endDrag(){ if(drag){ drag=null; svg.classList.remove('drag'); } }
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('wheel', function(e){ e.preventDefault(); zoom(e.deltaY>0?1.18:1/1.18); }, {passive:false});
  function zoom(f){
    userMoved=true;
    var nw=Math.min(VW*2, Math.max(VW*0.05, view.w*f)), k=nw/view.w;
    var cx=view.x+view.w/2, cy=view.y+view.h/2;
    view.w=nw; view.h=view.h*k; view.x=cx-view.w/2; view.y=cy-view.h/2;
    svg.setAttribute('viewBox', view.x+' '+view.y+' '+view.w+' '+view.h);
    drawMap();
  }
  document.getElementById('zin').onclick=function(){ zoom(1/1.4); };
  document.getElementById('zout').onclick=function(){ zoom(1.4); };
  document.getElementById('zfit').onclick=function(){ userMoved=false; reframe(); drawMap(); };

  // ── 方向列 ────────────────────────────────────────────────────────────
  var dirsBox=document.getElementById('dirs'), placesBox=document.getElementById('places');
  function drawPlaces(){
    placesBox.textContent='';
    var list=PLACES.slice();
    if(!list.filter(function(x){ return x.name===place.name; }).length) list.push(place);
    list.forEach(function(pl){
      var b=document.createElement('button');
      b.type='button'; b.textContent=pl.name;
      b.setAttribute('aria-pressed', pl.name===place.name?'true':'false');
      b.onclick=function(){
        place=pl; plat=null; picked=null; userMoved=false;
        try{ localStorage.setItem('busPlace', pl.name); }catch(e){}
        render();
      };
      placesBox.appendChild(b);
    });
    var more=document.createElement('button');
    more.type='button'; more.textContent='換站…';
    more.setAttribute('aria-pressed','false');
    more.onclick=function(){ q.value=''; drawOpts(); dlg.showModal(); q.focus(); };
    placesBox.appendChild(more);
  }
  function drawDirs(){
    dirsBox.textContent='';
    var ps=platforms();
    if(!ps.length) return;
    if(!ps.filter(function(o){ return o.L===String(plat); }).length) plat=ps[0].L;
    ps.forEach(function(o){
      var b=document.createElement('button');
      b.type='button'; b.textContent=platLabel(o);
      b.setAttribute('aria-pressed', o.L===String(plat)?'true':'false');
      b.onclick=function(){ plat=o.L; picked=null; userMoved=false; render(); };
      dirsBox.appendChild(b);
    });
  }

  // ── 換站對話框 ────────────────────────────────────────────────────────
  var dlg=document.getElementById('picker'), q=document.getElementById('q'), opts=document.getElementById('opts');
  function drawOpts(){
    var term=(q.value||'').trim();
    var names=Object.keys(stopIndex);
    if(term) names=names.filter(function(n){ return n.indexOf(term)>=0; });
    names.sort();
    opts.textContent='';
    names.slice(0,120).forEach(function(n){
      var rs={}; stopIndex[n].forEach(function(e){ rs[S.meta[e.rid].name]=1; });
      var b=document.createElement('button');
      b.type='button'; b.className='opt';
      b.innerHTML='<span>'+n+'</span><span class="rs">'+Object.keys(rs).join('・')+'</span>';
      b.onclick=function(){
        var f = PLACES.filter(function(x){ return x.name===n; })[0];
        place = f || {name:n, match:[n], routes:null, ntpc:[]};
        plat=null; picked=null; userMoved=false;
        try{ localStorage.setItem('busPlace', n); }catch(e){}
        dlg.close(); render();
      };
      opts.appendChild(b);
    });
    if(!names.length) opts.innerHTML='<p class="empty">找不到這個站名。</p>';
  }
  document.getElementById('close').onclick=function(){ dlg.close(); };
  q.addEventListener('input', drawOpts);

  // ── 主渲染 ────────────────────────────────────────────────────────────
  function applyMapVisibility(){
    var on = showMap || globalMode;
    document.getElementById('shell').classList.toggle('nomap', !on);
    var b=document.getElementById('showmap');
    b.textContent = showMap ? '隱藏地圖' : '顯示地圖';
    b.setAttribute('aria-pressed', showMap ? 'true':'false');
    b.disabled = globalMode;
    return on;
  }

  function render(){
    document.getElementById('stopname').textContent = place.name;
    drawPlaces();
    drawDirs();
    computeRows();
    var rb=document.getElementById('showroad');
    rb.setAttribute('aria-pressed', showRoad?'true':'false');
    drawRoad();
    drawBoard();
    var mapOn = applyMapVisibility();
    if(mapOn){
      if(!userMoved) reframe();
      drawMap();
    }
    document.getElementById('stamp').textContent = cur ? cur.u.slice(11) : '連線中…';
    var n = globalMode ? (cur?cur.bus.length:0) : rows.filter(function(r){ return r.bus; }).length;
    var jamN=0, slowN=0;
    if(!globalMode) visibleRows().forEach(function(r){
      heat(r).forEach(function(h){ if(h.cls==='jam') jamN++; else slowN++; });
    });
    document.getElementById('chip').textContent = globalMode
      ? (n+' 輛在線（整條路線）')
      : (n ? (n+' 台來車　停滯 '+jamN+' 段／低速 '+slowN+' 段') : '目前沒有可定位的來車');
  }

  // ── 連線 ──────────────────────────────────────────────────────────────
  var errBox=document.getElementById('err');
  function setError(m){
    errBox.textContent=m||'';
    document.getElementById('app').classList.toggle('down', !!m);
  }
  function guard(p){
    return p.catch(function(e){
      failures++;
      var msg=e.message;
      if(/Failed to fetch|NetworkError|load failed/i.test(msg) && location.protocol==='file:')
        msg='瀏覽器擋住 file:// 的跨網域抓取。請在這個檔案的資料夾執行 '
          + '`python -m http.server 8000`，再開 http://localhost:8000/'
          + location.pathname.split('/').pop();
      setError('更新失敗（'+failures+' 次）：'+msg);
    });
  }
  function start(){
    running=true;
    var t=document.getElementById('toggle');
    t.textContent='自動更新中'; t.setAttribute('aria-pressed','true');
    document.getElementById('app').classList.add('live');
    if(busTimer) clearInterval(busTimer);
    if(etaTimer) clearInterval(etaTimer);
    busTimer=setInterval(function(){ guard(pollBuses()); }, BUS_MS);
    etaTimer=setInterval(function(){ guard(pollEta()); }, ETA_MS);
    guard(pollBuses()); guard(pollEta());
  }
  function stop(){
    running=false;
    var t=document.getElementById('toggle');
    t.textContent='已暫停'; t.setAttribute('aria-pressed','false');
    document.getElementById('app').classList.remove('live');
    clearInterval(busTimer); clearInterval(etaTimer); busTimer=etaTimer=null;
  }
  document.getElementById('toggle').onclick=function(){ running?stop():start(); };
  document.getElementById('once').onclick=function(){ guard(pollBuses()); guard(pollEta()); };
  Array.prototype.forEach.call(document.querySelectorAll('.win button'), function(b){
    b.onclick=function(){
      WINDOW_S = +b.dataset.w;
      Array.prototype.forEach.call(document.querySelectorAll('.win button'), function(x){
        x.setAttribute('aria-pressed', x===b ? 'true' : 'false');
      });
      picked=null; userMoved=false; render();
    };
  });
  document.getElementById('showroad').onclick=function(){
    showRoad=!showRoad;
    try{ localStorage.setItem('busShowRoad', showRoad?'1':'0'); }catch(e){}
    render();
  };
  document.getElementById('showmap').onclick=function(){
    showMap=!showMap; userMoved=false;
    try{ localStorage.setItem('busShowMap', showMap?'1':'0'); }catch(e){}
    render();
  };
  document.getElementById('mode').onclick=function(){
    globalMode=!globalMode; picked=null; userMoved=false;
    this.setAttribute('aria-pressed', globalMode?'true':'false');
    this.textContent = globalMode ? '回到站牌' : '看整條路線';
    document.getElementById('shell').classList.toggle('global', globalMode);
    render();
  };
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ if(running){ clearInterval(busTimer); clearInterval(etaTimer); } }
    else if(running){ start(); }
  });

  // ── 啟動 ──────────────────────────────────────────────────────────────
  buildGeometry();
  buildIndex();
  render();
  start();
})();
</script>
</body>
</html>
